<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-do List with Persistence</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #333;
        color: #fff;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
      }

      h1 {
        font-size: 2.5rem;
        margin: 20px 0;
        margin-top: 50px;
      }

      h3 {
        font-size: 1.5rem;
        margin-bottom: 10px;
      }

      .add-new {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 20px;
      }

      #new-entry {
        width: 300px;
        height: 50px;
        padding: 0 15px;
        border-radius: 10px;
        border: none;
        font-size: 1rem;
      }

      #add-button {
        width: 100px;
        height: 50px;
        border-radius: 10px;
        background: #666;
        border: none;
        font-size: 1rem;
        color: #fff;
        transition: background-color 0.2s ease;
      }

      #add-button:hover {
        background-color: #07f;
      }

      .second-div {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        width: 100%;
        max-width: 1200px;
      }

      .task-list {
        width: 45%;
        min-height: 200px;
        border-radius: 20px;
        background: #444;
        padding: 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      }

      ul {
        list-style: none;
        width: 100%;
        padding: 0;
        margin-top: 10px;
      }

      .ul1-li {
        background: #555;
        border-radius: 10px;
        margin-bottom: 10px;
        padding: 10px 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      }

      .task-name {
        font-size: 1rem;
        flex-grow: 1;
      }

      .ul1-li-buttons {
        display: flex;
        gap: 5px;
      }

      button {
        width: 40px;
        height: 40px;
        border-radius: 5px;
        border: none;
        background: #666;
        color: #fff;
        font-size: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }

      button img {
        width: 60%;
        height: auto;
      }

      button.complete-task:hover {
        background: #3f7;
      }

      button.edit-task:hover {
        background: #fd1;
      }

      button.restore-task:hover {
        background: #b6f;
      }

      button.delete-task:hover {
        background: #f56;
      }

      @media (max-width: 768px) {
        .task-list {
          width: 90%;
        }

        #new-entry {
          width: 200px;
        }
      }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body>
    <h1>To-Do List</h1>
    <div class="add-new">
      <input type="text" id="new-entry" placeholder="Enter new task" />
      <button id="add-button">Add</button>
    </div>

    <div class="second-div">
      <div class="task-list" id="uncompleted-tasks-list">
        <h3>Uncompleted Tasks</h3>
        <ul id="ul-1"></ul>
      </div>
      <div class="task-list" id="completed-tasks-list">
        <h3>Completed Tasks</h3>
        <ul id="ul-2"></ul>
      </div>
    </div>

    <script>
      $(document).ready(function () {
        loadTasks();

        function addTask() {
          let task = $("#new-entry").val();
          if (task) {
            let taskHtml = createTaskHTML(task, false);
            $("#ul-1").append(taskHtml);
            saveTasks();
            $("#new-entry").val("");
          }
        }

        $("#add-button").click(function () {
          addTask();
        });

        $("#new-entry").keypress(function (event) {
          if (event.which === 13) {
            addTask();
          }
        });

        $(document).on("click", ".complete-task", function () {
          let parentLi = $(this).closest("li");
          parentLi.find(".complete-task").remove();
          parentLi.find(".edit-task").remove();
          parentLi
            .find(".ul1-li-buttons")
            .prepend(
              '<button class="restore-task"><img src="./restore.svg" alt="Restore Task"></button>'
            );
          $("#ul-2").append(parentLi);
          saveTasks();
        });

        $(document).on("click", ".restore-task", function () {
          let parentLi = $(this).closest("li");
          parentLi.find(".restore-task").remove();

          let buttonHtml =
            '<button class="complete-task"><img src="./completed.svg" alt="Complete Task"></button>' +
            '<button class="edit-task"><img src="./edit.svg" alt="Edit Task"></button>' +
            '<button class="delete-task"><img src="./delete.svg" alt="Delete Task"></button>';

          parentLi.find(".ul1-li-buttons").html(buttonHtml);
          $("#ul-1").append(parentLi);

          saveTasks();
        });

        $(document).on("click", ".delete-task", function () {
          $(this).closest("li").remove();
          saveTasks();
        });

        $(document).on("click", ".edit-task", function () {
          let parentLi = $(this).closest("li");
          let taskNameSpan = parentLi.find(".task-name");
          let currentTaskName = taskNameSpan.text();
          let newTaskName = prompt("Edit Task:", currentTaskName);

          if (newTaskName) {
            taskNameSpan.text(newTaskName);
            saveTasks();
          }
        });

        function saveTasks() {
          let uncompletedTasks = [];
          let completedTasks = [];

          $("#ul-1 li").each(function () {
            uncompletedTasks.push($(this).find(".task-name").text());
          });

          $("#ul-2 li").each(function () {
            completedTasks.push($(this).find(".task-name").text());
          });

          localStorage.setItem(
            "uncompletedTasks",
            JSON.stringify(uncompletedTasks)
          );
          localStorage.setItem(
            "completedTasks",
            JSON.stringify(completedTasks)
          );
        }

        function loadTasks() {
          let uncompletedTasks =
            JSON.parse(localStorage.getItem("uncompletedTasks")) || [];
          let completedTasks =
            JSON.parse(localStorage.getItem("completedTasks")) || [];

          uncompletedTasks.forEach(function (task) {
            let taskHtml = createTaskHTML(task, false);
            $("#ul-1").append(taskHtml);
          });

          completedTasks.forEach(function (task) {
            let taskHtml = createTaskHTML(task, true);
            $("#ul-2").append(taskHtml);
          });
        }

        function createTaskHTML(task, isCompleted) {
          let taskHtml = `<li class="ul1-li">
                <span class="task-name">${task}</span>
                <div class="ul1-li-buttons">
                  ${
                    isCompleted
                      ? '<button class="restore-task"><img src="./restore.svg" alt="Restore Task"></button>'
                      : '<button class="complete-task"><img src="./completed.svg" alt="Complete Task"></button>' +
                        '<button class="edit-task"><img src="./edit.svg" alt="Edit Task"></button>'
                  }
                  <button class="delete-task"><img src="./delete.svg" alt="Delete Task"></button>
                </div>
              </li>`;
          return taskHtml;
        }
      });
    </script>
  </body>
</html>
